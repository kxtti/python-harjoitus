Kirjoita ohjelma, joka kysyy käyttäjältä lukuja. Kun käyttäjä syöttää luvun, 
jonka hän on jo aiemmin syöttänyt, ohjelma ilmoittaa, että luku on jo annettu, 
lopettaa toimintansa ja tulostaa kaikki annetut luvut konsoliin nousevassa järjestyksessä. (2p)
